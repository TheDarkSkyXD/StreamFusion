import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def appConfig = new JsonSlurper().parse(file("../../native-config.json"))
def production = System.getenv("STREAMFUSION_RELEASE_CHANNEL") == "production"
def releaseVersion = production ? System.getenv("STREAMFUSION_PRODUCTION_VERSION") : appConfig.version
def releaseVersionCode = production ? System.getenv("STREAMFUSION_PRODUCTION_VERSION_CODE") : appConfig.android.versionCode.toString()
if (production) {
  if (releaseVersion == null || !(releaseVersion ==~ /\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)(?:\.\d+)?)?/)) throw new GradleException("A production build requires STREAMFUSION_PRODUCTION_VERSION")
  if (releaseVersionCode == null || !(releaseVersionCode ==~ /[1-9]\d*/)) throw new GradleException("A production build requires STREAMFUSION_PRODUCTION_VERSION_CODE")
  def certificate = new JsonSlurper().parse(file("../../config/production-signing-certificate.json"))
  if (!(certificate.certificateSha256 ==~ /[0-9a-f]{64}/)) throw new GradleException("The production signing certificate must be pinned before building")
  def validation = ["node", file("../../scripts/firebase-release-config.mjs").absolutePath, "--check"].execute(null, rootDir)
  def validationOutput = new StringBuffer()
  def validationErrors = new StringBuffer()
  validation.waitForProcessOutput(validationOutput, validationErrors)
  if (validation.exitValue() != 0) throw new GradleException(validationErrors.toString().trim() ?: "Invalid production Firebase configuration")
}

if (file("google-services.json").exists()) {
  apply plugin: "com.google.gms.google-services"
}

react {
  root = file("../..")
  entryFile = file("../../index.js")
  reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).parentFile
  codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json')"].execute(null, rootDir).text.trim()).parentFile
  cliFile = new File(["node", "--print", "require.resolve('@react-native-community/cli/build/bin.js')"].execute(null, rootDir).text.trim())
  autolinkLibrariesWithApp()
}
android {
  namespace "com.thedarkskyxd.streamfusion.dev"
  compileSdk rootProject.ext.compileSdkVersion
  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  defaultConfig {
    applicationId production ? "com.thedarkskyxd.streamfusion" : appConfig.android.package
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    versionCode releaseVersionCode.toInteger()
    versionName releaseVersion
    manifestPlaceholders = [appScheme: production ? "streamfusion" : appConfig.scheme]
    resValue "string", "app_name", production ? "StreamFusion" : appConfig.name
    buildConfigField "String", "APP_SCHEME", '"' + (production ? 'streamfusion' : appConfig.scheme) + '"'
  }
  signingConfigs {
    release {
      storeFile file(System.getenv("STREAMFUSION_UPLOAD_STORE_FILE") ?: "release.keystore")
      storePassword System.getenv("STREAMFUSION_UPLOAD_STORE_PASSWORD")
      keyAlias System.getenv("STREAMFUSION_UPLOAD_KEY_ALIAS")
      keyPassword System.getenv("STREAMFUSION_UPLOAD_KEY_PASSWORD")
    }
    debug {
      if (file("debug.keystore").exists()) storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }
  buildTypes {
    debug { signingConfig signingConfigs.debug }
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }
  packagingOptions { jniLibs { useLegacyPackaging false } }
}
dependencies {
  implementation("com.facebook.react:react-android")
  implementation("com.facebook.react:hermes-android")
  implementation project(":streamfusion-native-contracts")
  implementation("com.facebook.fresco:animated-gif:3.6.0")
  implementation("com.facebook.fresco:webpsupport:3.6.0")
  implementation("com.facebook.fresco:animated-webp:3.6.0")
  implementation("androidx.core:core-splashscreen:1.0.1")
  androidTestImplementation("androidx.test:runner:1.6.2")
  androidTestImplementation("androidx.test.ext:junit:1.2.1")
  androidTestImplementation("com.google.firebase:firebase-messaging:25.0.1")
}
