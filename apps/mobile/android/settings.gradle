pluginManagement {
  def reactNativeGradlePlugin = new File(providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
  }.standardOutput.asText.get().trim()).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
}
plugins { id("com.facebook.react.settings") }
providers.exec {
  workingDir(rootDir)
  commandLine("node", "../scripts/prepare-native-dependencies.cjs")
}.result.get().assertNormalExitValue()
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  def cli = providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('@react-native-community/cli/build/bin.js')")
  }.standardOutput.asText.get().trim()
  def configFile = file("build/generated/autolinking/current-config.json")
  configFile.parentFile.mkdirs()
  configFile.text = providers.exec {
    workingDir(file(".."))
    commandLine("node", cli, "config")
  }.standardOutput.asText.get()
  ex.autolinkLibrariesFromConfigFile(configFile)
}
rootProject.name = "StreamFusion"
include ":app"
include ":streamfusion-native-contracts"
project(":streamfusion-native-contracts").projectDir = file("../modules/streamfusion-native-contracts/android")
includeBuild(new File(providers.exec {
  workingDir(rootDir)
  commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')")
}.standardOutput.asText.get().trim()).getParentFile())
