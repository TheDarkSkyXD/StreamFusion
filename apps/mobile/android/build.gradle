import org.gradle.api.flow.BuildWorkResult
import org.gradle.api.flow.FlowAction
import org.gradle.api.flow.FlowParameters
import org.gradle.api.flow.FlowProviders
import org.gradle.api.flow.FlowScope

abstract class NativeBuildCleanup implements FlowAction<NativeBuildCleanup.Parameters> {
  interface Parameters extends FlowParameters {
    @Input
    Property<BuildWorkResult> getBuildResult()
    @Input
    Property<String> getStagingPath()
  }

  @Inject
  abstract FileSystemOperations getFileSystemOperations()

  @Override
  void execute(Parameters parameters) {
    fileSystemOperations.delete { spec ->
      spec.delete(parameters.stagingPath.get())
      spec.followSymlinks = false
    }
  }
}

abstract class NativeBuildCleanupPlugin implements Plugin<Project> {
  @Inject
  abstract FlowScope getFlowScope()
  @Inject
  abstract FlowProviders getFlowProviders()

  @Override
  void apply(Project target) {
    flowScope.always(NativeBuildCleanup) {
      parameters.buildResult.set(flowProviders.buildWorkResult)
      parameters.stagingPath.set(target.file("../.cxx").absolutePath)
    }
  }
}

buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 30
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
  }
  repositories { google(); mavenCentral() }
  dependencies {
    classpath("com.android.tools.build:gradle:8.12.0")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}
apply plugin: NativeBuildCleanupPlugin
allprojects { repositories { google(); mavenCentral() } }
def windows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
def ninja = new File(file("../../.."), ".cache/ninja/1.13.2/ninja.exe")
if (windows && !ninja.isFile()) throw new GradleException("Windows Ninja setup did not complete")
subprojects { nativeProject ->
  ["com.android.application", "com.android.library"].each { plugin ->
    nativeProject.pluginManager.withPlugin(plugin) {
      nativeProject.extensions.getByName("androidComponents").finalizeDsl { android ->
        def moduleIndex = rootProject.subprojects.toList().sort { it.path }.indexOf(nativeProject)
        android.externalNativeBuild.cmake.buildStagingDirectory = rootProject.file("../.cxx/${moduleIndex}")
        if (windows) {
          android.defaultConfig.externalNativeBuild.cmake.arguments.add("-DCMAKE_MAKE_PROGRAM=" + ninja.absolutePath.replace('\\', '/'))
        }
      }
    }
  }
}

// Register native path settings before this plugin evaluates :app.
apply plugin: "com.facebook.react.rootproject"
