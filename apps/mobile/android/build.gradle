buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 30
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
  }
  repositories { google(); mavenCentral() }
  dependencies {
    classpath("com.android.tools.build:gradle:8.12.0")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}
allprojects { repositories { google(); mavenCentral() } }
if (System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")) {
  def repositoryRoot = file("../../..").canonicalFile
  def ninja = new File(repositoryRoot, ".cache/ninja/1.13.2/ninja.exe")
  if (!ninja.isFile()) throw new GradleException("Windows Ninja setup did not complete")
  subprojects { nativeProject ->
    ["com.android.application", "com.android.library"].each { plugin ->
      nativeProject.pluginManager.withPlugin(plugin) {
        nativeProject.extensions.getByName("androidComponents").finalizeDsl { android ->
          def moduleIndex = rootProject.subprojects.toList().sort { it.path }.indexOf(nativeProject)
          android.externalNativeBuild.cmake.buildStagingDirectory = new File(repositoryRoot, ".cxx/${moduleIndex}")
          android.defaultConfig.externalNativeBuild.cmake.arguments.add("-DCMAKE_MAKE_PROGRAM=" + ninja.absolutePath.replace('\\', '/'))
        }
      }
    }
  }
}

// Register native path settings before this plugin evaluates :app.
apply plugin: "com.facebook.react.rootproject"
