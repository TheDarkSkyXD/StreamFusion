version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/apps/desktop"
      - "/apps/mobile"
      - "/apps/worker"
      - "/apps/integration-relay"
      - "/packages/core"
      - "/packages/tooling"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
