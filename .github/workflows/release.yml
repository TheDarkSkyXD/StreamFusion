name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.0.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      prerelease_label: ${{ steps.release.outputs.prerelease_label }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and package version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          node scripts/release-policy.mjs "$RELEASE_TAG" "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate dependency sources and lockfile
        run: |
          npm run lint:dependencies
          npm run lint:lockfile

      - name: Verify signatures and audit the complete dependency graph
        run: |
          npm run audit:signatures
          npm run audit:dependencies

      - name: Run approved dependency setup
        run: npm run rebuild:dependencies

      - name: Lint and typecheck
        run: |
          npm run --workspace @streamfusion/core lint
          npm run lint:core-imports
          npm --prefix apps/desktop run lint
          npm run typecheck

      - name: Test workspace
        run: npm test

      - name: Build worker dry run
        run: npm run --workspace streamfusion-worker deploy:dry-run

  build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: verify
    environment: production-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            artifact_name: streamfusion-windows-x64
          - runner: macos-15-intel
            platform: macos
            arch: x64
            artifact_name: streamfusion-macos-x64
          - runner: macos-15
            platform: macos
            arch: arm64
            artifact_name: streamfusion-macos-arm64
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install and verify desktop dependencies
        run: |
          npm ci --ignore-scripts
          npm audit signatures
          npm run rebuild:dependencies

      - name: Require signing and notarization credentials
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" || { echo "Missing code-signing certificate" >&2; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "Missing code-signing certificate password" >&2; exit 1; }
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            test -n "$APPLE_ID" || { echo "Missing APPLE_ID" >&2; exit 1; }
            test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD" >&2; exit 1; }
            test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID" >&2; exit 1; }
          fi

      - name: Rebuild native dependencies
        run: npm --prefix apps/desktop run rebuild-deps:${{ matrix.arch }}

      - name: Build shared core
        run: npm run --workspace @streamfusion/core build

      - name: Test Windows system contracts
        if: matrix.platform == 'windows'
        run: npm --prefix apps/desktop run test:system

      - name: Build desktop
        run: npm --prefix apps/desktop run build

      - name: Package signed Windows application
        if: matrix.platform == 'windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm --prefix apps/desktop run package:${{ matrix.platform }}:${{ matrix.arch }}:signed

      - name: Verify Windows Authenticode signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps/desktop/release -Filter 'StreamFusion-*-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Signed Windows installer was not produced' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Invalid Authenticode signature: $($signature.Status) $($signature.StatusMessage)"
          }

      - name: Package signed and notarized macOS application
        if: matrix.platform == 'macos'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm --prefix apps/desktop run package:${{ matrix.platform }}:${{ matrix.arch }}:signed

      - name: Verify macOS signature, Gatekeeper, and notarization ticket
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          APP_PATH="$(find apps/desktop/release -type d -name 'StreamFusion.app' -print -quit)"
          test -n "$APP_PATH" || { echo "Packaged StreamFusion.app was not found" >&2; exit 1; }
          codesign --verify --deep --strict "$APP_PATH"
          spctl --assess --type exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/StreamFusion-*-Setup.exe
            apps/desktop/release/StreamFusion-*-Setup.exe.blockmap
            apps/desktop/release/StreamFusion-*-x64.dmg
            apps/desktop/release/StreamFusion-*-x64.zip
            apps/desktop/release/StreamFusion-*-arm64.dmg
            apps/desktop/release/StreamFusion-*-arm64.zip
            apps/desktop/release/latest.yml
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publish GitHub release
    needs: [verify, build]
    environment: production-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm audit signatures

      - name: Download packaged applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Validate and prepare release assets
        run: node .github/scripts/merge_artifacts.js "${{ needs.verify.outputs.version }}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          release_command=(
            gh release create "$RELEASE_TAG"
            release-assets/*
            --verify-tag
            --generate-notes
            --title "StreamFusion v$VERSION"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_command+=(--prerelease)
          else
            release_command+=(--latest)
          fi
          "${release_command[@]}"
