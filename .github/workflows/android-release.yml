name: Android release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Android release tag (for example, android-v0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      product: ${{ steps.release.outputs.product }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      asset_name: ${{ steps.release.outputs.asset_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and mobile version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          case "$RELEASE_TAG" in
            android-v*) ;;
            *) echo "This workflow only publishes the android-v tag namespace, got $RELEASE_TAG" >&2; exit 1 ;;
          esac
          node scripts/release-policy.mjs "$RELEASE_TAG" "$GITHUB_OUTPUT"
          printf 'asset_name=StreamFusion-android-%s.apk\n' "${RELEASE_TAG#android-}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate dependency sources and lockfile
        run: |
          npm run lint:dependencies
          npm run lint:lockfile
          npm run audit:signatures

      - name: Audit the shipped Android dependency tree
        # The repository-wide audit covers the Electron and worker trees and
        # build-time tooling such as @expo/fingerprint and jsdom. Those
        # advisories never reach a device. This gate covers the dependencies
        # that are actually bundled into the APK, which is the tree a user runs.
        run: node scripts/audit-android-release-deps.mjs

      - name: Require the Android tag namespace and a mobile version
        shell: bash
        env:
          PRODUCT: ${{ steps.release.outputs.product }}
        run: |
          set -euo pipefail
          test "$PRODUCT" = mobile || {
            echo "release-policy.mjs resolved product=$PRODUCT for an android-v tag" >&2
            exit 1
          }

      - name: Lint, typecheck, and test the mobile workspace
        run: |
          npm run --workspace @streamfusion/core lint
          npm run lint:core-imports
          npm run --workspace @streamfusion/mobile lint
          npm run --workspace @streamfusion/mobile typecheck
          npm run --workspace @streamfusion/mobile test

  signing:
    name: Verify Android signing prerequisites
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Require a pinned production signing certificate
        run: npm run --workspace @streamfusion/mobile verify:release

      - name: Resolve the production identity closed
        env:
          STREAMFUSION_RELEASE_CHANNEL: production
          STREAMFUSION_PRODUCTION_EAS_PROJECT_ID: ${{ vars.STREAMFUSION_PRODUCTION_EAS_PROJECT_ID }}
          STREAMFUSION_PRODUCTION_EAS_OWNER: ${{ vars.STREAMFUSION_PRODUCTION_EAS_OWNER }}
          STREAMFUSION_PRODUCTION_VERSION: ${{ needs.verify.outputs.version }}
          STREAMFUSION_PRODUCTION_VERSION_CODE: ${{ vars.ANDROID_PRODUCTION_VERSION_CODE }}
        run: npm run --workspace @streamfusion/mobile config:android:production

  build:
    name: Build signed production APK
    needs: [verify, signing]
    environment: android-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Materialize the production keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMFUSION_MOBILE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STREAMFUSION_MOBILE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STREAMFUSION_MOBILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STREAMFUSION_MOBILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || {
              echo "missing secret $name; the production keystore is not configured" >&2
              exit 1
            }
          done
          mkdir -p .signing
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/release.jks
          printf 'STREAMFUSION_UPLOAD_STORE_FILE=%s\n' "$PWD/.signing/release.jks" >> "$GITHUB_ENV"
          printf 'STREAMFUSION_UPLOAD_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'STREAMFUSION_UPLOAD_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'STREAMFUSION_UPLOAD_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Prebuild the Android project
        run: npm run --workspace @streamfusion/mobile prebuild:android

      - name: Assemble the signed release APK
        shell: bash
        env:
          ASSET_NAME: ${{ needs.verify.outputs.asset_name }}
        run: |
          set -euo pipefail
          pushd apps/mobile/android
          ./gradlew --no-daemon --stacktrace app:assembleRelease
          popd
          mkdir -p android-release-set
          test -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk || {
            echo "Gradle produced no release APK" >&2
            exit 1
          }
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "android-release-set/$ASSET_NAME"

      - name: Verify the APK against the pinned signer
        shell: bash
        env:
          ASSET_NAME: ${{ needs.verify.outputs.asset_name }}
        run: |
          set -euo pipefail
          export APKSIGNER_PATH="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          npm run --workspace @streamfusion/mobile verify:release -- "android-release-set/$ASSET_NAME"

      - name: Assemble the Android Release Set
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          VERSION_CODE: ${{ vars.ANDROID_PRODUCTION_VERSION_CODE }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/assemble-android-release-set.mjs \
            android-release-set \
            "$RELEASE_TAG" "$VERSION" "$PRERELEASE" "$VERSION_CODE" \
            "$COMMIT_SHA" "$RUN_URL"

      - name: Upload the Android Release Set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamfusion-android-${{ needs.verify.outputs.version }}
          path: android-release-set/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [verify, signing, build]
    environment: android-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download the Android Release Set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: streamfusion-android-${{ needs.verify.outputs.version }}
          path: release-assets

      - name: Re-verify the signer after transport
        shell: bash
        env:
          ASSET_NAME: ${{ needs.verify.outputs.asset_name }}
        run: |
          set -euo pipefail
          export APKSIGNER_PATH="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          npm run --workspace @streamfusion/mobile verify:release -- "release-assets/$ASSET_NAME"

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          publish_flag=(--latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then
            publish_flag=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --verify-tag \
            --draft \
            --title "StreamFusion Android $VERSION" \
            --notes-file release-assets/release-notes.md \
            "${publish_flag[@]}"

      - name: Publish the immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          latest_flag=()
          if [[ "$PRERELEASE" != "true" ]]; then
            latest_flag=(--latest)
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${latest_flag[@]}"
          gh release verify "$RELEASE_TAG"
