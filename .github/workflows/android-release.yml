name: Android release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Android release tag (for example, android-v0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      product: ${{ steps.release.outputs.product }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      asset_name: ${{ steps.release.outputs.asset_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and mobile version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          case "$RELEASE_TAG" in
            android-v*) ;;
            *) echo "This workflow only publishes the android-v tag namespace, got $RELEASE_TAG" >&2; exit 1 ;;
          esac
          node scripts/release-policy.mjs "$RELEASE_TAG" "$GITHUB_OUTPUT"
          printf 'asset_name=StreamFusion-android-%s.apk\n' "${RELEASE_TAG#android-}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate dependency sources and lockfile
        run: |
          npm run lint:dependencies
          npm run lint:lockfile
          npm run audit:signatures
          npm run audit:dependencies

      - name: Require the Android tag namespace and a mobile version
        shell: bash
        env:
          PRODUCT: ${{ steps.release.outputs.product }}
        run: |
          set -euo pipefail
          test "$PRODUCT" = mobile || {
            echo "release-policy.mjs resolved product=$PRODUCT for an android-v tag" >&2
            exit 1
          }

      - name: Lint, typecheck, and test the mobile workspace
        run: |
          npm run --workspace @streamfusion/core lint
          npm run lint:core-imports
          npm run --workspace @streamfusion/mobile lint
          npm run --workspace @streamfusion/mobile typecheck
          npm run --workspace @streamfusion/mobile test

  signing:
    name: Verify Android signing prerequisites
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Require a pinned production signing certificate
        run: npm run --workspace @streamfusion/mobile verify:release

      - name: Resolve the production identity closed
        env:
          STREAMFUSION_RELEASE_CHANNEL: production
          STREAMFUSION_PRODUCTION_EAS_PROJECT_ID: ${{ vars.STREAMFUSION_PRODUCTION_EAS_PROJECT_ID }}
          STREAMFUSION_PRODUCTION_EAS_OWNER: ${{ vars.STREAMFUSION_PRODUCTION_EAS_OWNER }}
          STREAMFUSION_PRODUCTION_VERSION: ${{ needs.verify.outputs.version }}
          STREAMFUSION_PRODUCTION_VERSION_CODE: ${{ vars.ANDROID_PRODUCTION_VERSION_CODE }}
        run: npm run --workspace @streamfusion/mobile config:android:production

  build:
    name: Build signed production APK
    needs: [verify, signing]
    environment: android-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm and the EAS CLI
        run: |
          npm install --global npm@11.19.0
          npm install --global eas-cli@24.8.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Request the EAS production build
        id: build
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          STREAMFUSION_RELEASE_CHANNEL: production
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd apps/mobile
          npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive \
            --json --wait > eas-build.json
          node ../../scripts/read-eas-build.mjs eas-build.json "$GITHUB_OUTPUT"

      - name: Download the EAS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.build.outputs.artifact_url }}
          ASSET_NAME: ${{ needs.verify.outputs.asset_name }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_URL" || { echo "EAS returned no artifact URL" >&2; exit 1; }
          mkdir -p android-release-set
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$ARTIFACT_URL" -o "android-release-set/$ASSET_NAME"

      - name: Verify the APK against the pinned signer
        shell: bash
        env:
          ASSET_NAME: ${{ needs.verify.outputs.asset_name }}
        run: |
          set -euo pipefail
          export APKSIGNER_PATH="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          npm run --workspace @streamfusion/mobile verify:release -- "android-release-set/$ASSET_NAME"

      - name: Assemble the Android Release Set
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          VERSION_CODE: ${{ vars.ANDROID_PRODUCTION_VERSION_CODE }}
          EAS_BUILD_ID: ${{ steps.build.outputs.build_id }}
          EAS_BUILD_URL: ${{ steps.build.outputs.build_url }}
        run: |
          set -euo pipefail
          node scripts/assemble-android-release-set.mjs \
            android-release-set \
            "$RELEASE_TAG" "$VERSION" "$PRERELEASE" "$VERSION_CODE" "$EAS_BUILD_ID" "$EAS_BUILD_URL"

      - name: Upload the Android Release Set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamfusion-android-${{ needs.verify.outputs.version }}
          path: android-release-set/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [verify, signing, build]
    environment: android-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download the Android Release Set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: streamfusion-android-${{ needs.verify.outputs.version }}
          path: release-assets

      - name: Re-verify the signer after transport
        shell: bash
        env:
          ASSET_NAME: ${{ needs.verify.outputs.asset_name }}
        run: |
          set -euo pipefail
          export APKSIGNER_PATH="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          npm run --workspace @streamfusion/mobile verify:release -- "release-assets/$ASSET_NAME"

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          publish_flag=(--latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then
            publish_flag=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --verify-tag \
            --draft \
            --title "StreamFusion Android $VERSION" \
            --notes-file release-assets/release-notes.md \
            "${publish_flag[@]}"

      - name: Publish the immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          latest_flag=()
          if [[ "$PRERELEASE" != "true" ]]; then
            latest_flag=(--latest)
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${latest_flag[@]}"
          gh release verify "$RELEASE_TAG"
