name: Start candidate macOS proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-boot:
    name: Start candidate macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            app_directory: mac
          - runner: macos-15
            arch: arm64
            app_directory: mac-arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency policy
        run: |
          npm run lint:dependencies
          npm run lint:lockfile
          npm run audit:signatures
          npm run audit:dependencies

      - name: Run approved dependency setup
        run: npm run rebuild:dependencies

      - name: Rebuild native dependencies for this host
        run: npm --prefix apps/desktop run rebuild-deps:${{ matrix.arch }}

      - name: Build shared core and Start candidate
        run: |
          npm run --workspace @streamfusion/core build
          npm run --workspace streamfusion build:start

      - name: Package unsigned candidate without publishing
        run: npm run --workspace streamfusion package:start -- --mac --${{ matrix.arch }}

      - name: Verify unchanged packaged application through native accessibility
        env:
          CANDIDATE_ARCH: ${{ matrix.arch }}
          CANDIDATE_APP_DIRECTORY: ${{ matrix.app_directory }}
        run: |
          node apps/desktop/scripts/verify-start-package-macos.mjs \
            --app "apps/desktop/.cache/start/package/$CANDIDATE_APP_DIRECTORY/StreamFusion.app" \
            --arch "$CANDIDATE_ARCH" \
            --evidence "$RUNNER_TEMP/start-candidate-evidence"

      - name: Upload package and proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: start-candidate-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/desktop/.cache/start/package/*.dmg
            apps/desktop/.cache/start/package/*.zip
            ${{ runner.temp }}/start-candidate-evidence
          if-no-files-found: warn
          retention-days: 7
