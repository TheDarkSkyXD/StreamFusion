name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate dependency sources
        run: npm run lint:dependencies

      - name: Validate lockfile
        run: npm run lint:lockfile

      - name: Verify registry signatures and attestations
        run: npm run audit:signatures

      - name: Audit the complete dependency graph
        run: npm run audit:dependencies

      - name: Run approved dependency setup
        run: npm run rebuild:dependencies

      - name: Lint shared core
        run: npm run --workspace @streamfusion/core lint

      - name: Verify core consumer imports
        run: npm run lint:core-imports

      - name: Typecheck shared core
        run: npm run --workspace @streamfusion/core typecheck

      - name: Test shared core contracts and architecture
        run: npm run --workspace @streamfusion/core test

      - name: Lint integration relay
        run: npm run --workspace @streamfusion/integration-relay lint

      - name: Typecheck integration relay
        run: npm run --workspace @streamfusion/integration-relay typecheck

      - name: Test integration relay boundaries
        run: npm run --workspace @streamfusion/integration-relay test

      - name: Build integration relay dry run
        run: npm run --workspace @streamfusion/integration-relay deploy:dry-run

      - name: Lint mobile
        run: npm run --workspace @streamfusion/mobile lint

      - name: Typecheck mobile
        run: npm run --workspace @streamfusion/mobile typecheck

      - name: Test mobile scaffold and architecture
        run: npm run --workspace @streamfusion/mobile test

      - name: Bundle mobile for Android
        run: npm run --workspace @streamfusion/mobile bundle:android

      - name: Test evidence verifier
        run: npm run test:evidence

      - name: Verify evidence catalog
        run: npm run verify:evidence

      - name: Lint desktop
        run: npm --prefix apps/desktop run lint

      - name: Typecheck desktop
        run: npm --prefix apps/desktop run typecheck

      - name: Check Desktop parity inventory
        run: npm --prefix apps/desktop run parity:desktop:check

      - name: Test desktop
        run: npm --prefix apps/desktop test
        # E2E playbooks are not run here: they require a live Electron build
        # started with `npm --prefix apps/desktop run dev:mcp`. See
        # apps/desktop/tests/e2e/README.md.

      - name: Typecheck worker
        run: npm run --workspace streamfusion-worker typecheck

      - name: Test worker
        run: npm run --workspace streamfusion-worker test

      - name: Build worker dry run
        run: npm run --workspace streamfusion-worker deploy:dry-run

  android-development:
    name: Android development APK and API 30 install
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build Android development APK
        run: npm run build:mobile:development

      - name: Install and launch on API 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "30"
            timeout 300 sh -c 'until adb shell service check package 2>/dev/null | grep -q "found"; do sleep 2; done'
            timeout 300 sh -c 'until adb shell cmd package list packages >/dev/null 2>&1; do sleep 2; done'
            adb install --no-streaming apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.thedarkskyxd.streamfusion.dev -c android.intent.category.LAUNCHER 1
            timeout 30 sh -c 'until adb shell pidof com.thedarkskyxd.streamfusion.dev; do sleep 1; done'

      - name: Upload development APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamfusion-android-development
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install and verify desktop dependencies
        run: |
          npm ci --ignore-scripts
          npm audit signatures
          npm run rebuild:dependencies

      - name: Rebuild native dependencies for package target
        run: npm --prefix apps/desktop run rebuild-deps:${{ matrix.arch }}

      - name: Build shared core
        run: npm run --workspace @streamfusion/core build

      - name: Test Windows system contracts
        if: matrix.platform == 'win32'
        run: npm --prefix apps/desktop run test:system

      - name: Build desktop
        run: npm --prefix apps/desktop run build

      - name: Package desktop
        run: npm --prefix apps/desktop run package:${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamfusion-${{ matrix.platform }}
          path: apps/desktop/release/**/*
          retention-days: 7
