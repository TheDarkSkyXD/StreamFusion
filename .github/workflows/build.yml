name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/desktop install --frozen-lockfile

      - name: Validate dependency sources
        run: pnpm lint:dependencies

      - name: Validate lockfile
        run: pnpm lint:lockfile

      - name: Lint desktop
        run: pnpm --dir apps/desktop lint

      - name: Typecheck desktop
        run: pnpm --dir apps/desktop typecheck

      - name: Test desktop
        run: pnpm --dir apps/desktop test
        # E2E playbooks are not run here: they require a live Electron build
        # started with `pnpm --dir apps/desktop dev:mcp`. See
        # apps/desktop/tests/e2e/README.md.

      - name: Typecheck worker
        run: pnpm --filter streamfusion-worker typecheck

      - name: Test worker
        run: pnpm --filter streamfusion-worker test

      - name: Build worker dry run
        run: pnpm --filter streamfusion-worker exec wrangler deploy --dry-run

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Rebuild native dependencies for package target
        run: pnpm --dir apps/desktop exec electron-builder install-app-deps --arch ${{ matrix.arch }}

      - name: Build desktop
        run: pnpm --dir apps/desktop build

      - name: Package desktop
        run: pnpm --dir apps/desktop exec electron-builder --publish never --${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamfusion-${{ matrix.platform }}
          path: apps/desktop/release/**/*
          retention-days: 7
