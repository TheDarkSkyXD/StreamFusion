name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CURRENT_ANDROID_API: "36"

jobs:
  verify-deps:
    name: Verify deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Test checked-in workflow contracts
        run: node --test scripts/release-workflow.test.mjs

      - name: Validate dependency sources
        run: npm run lint:dependencies

      - name: Validate lockfile
        run: npm run lint:lockfile

      - name: Verify registry signatures and attestations
        run: npm run audit:signatures

      - name: Audit the complete dependency graph
        run: npm run audit:dependencies

      - name: Run approved dependency setup
        run: npm run rebuild:dependencies

  verify-core:
    name: Verify core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run approved dependency setup
        run: npm run rebuild:dependencies

      - name: Lint shared core
        run: npm run --workspace @streamfusion/core lint

      - name: Verify core consumer imports
        run: npm run lint:core-imports

      - name: Typecheck shared core
        run: npm run --workspace @streamfusion/core typecheck

      - name: Test shared core contracts and architecture
        run: npm run --workspace @streamfusion/core test

      - name: Lint integration relay
        run: npm run --workspace @streamfusion/integration-relay lint

      - name: Typecheck integration relay
        run: npm run --workspace @streamfusion/integration-relay typecheck

      - name: Test integration relay boundaries
        run: npm run --workspace @streamfusion/integration-relay test

      - name: Build integration relay dry run
        run: npm run --workspace @streamfusion/integration-relay deploy:dry-run

  verify-mobile:
    name: Verify mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run approved dependency setup
        run: npm run rebuild:dependencies

      - name: Lint mobile
        run: npm run --workspace @streamfusion/mobile lint

      - name: Typecheck mobile
        run: npm run --workspace @streamfusion/mobile typecheck

      - name: Test mobile scaffold and architecture
        run: npm run --workspace @streamfusion/mobile test

      - name: Bundle mobile for Android
        run: npm run --workspace @streamfusion/mobile bundle:android

  verify-desktop:
    name: Verify desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run approved dependency setup
        run: npm run rebuild:dependencies

      - name: Test evidence verifier
        run: npm run test:evidence

      - name: Verify evidence catalog
        run: npm run verify:evidence

      - name: Lint desktop
        run: npm --prefix apps/desktop run lint

      - name: Typecheck desktop
        run: npm --prefix apps/desktop run typecheck

      - name: Check Desktop parity inventory
        run: npm --prefix apps/desktop run parity:desktop:check

      - name: Test desktop
        run: npm --prefix apps/desktop test
        # E2E playbooks are not run here: they require a live Electron build
        # started with `npm --prefix apps/desktop run dev:mcp`. See
        # apps/desktop/tests/e2e/README.md.

      - name: Typecheck worker
        run: npm run --workspace streamfusion-worker typecheck

      - name: Test worker
        run: npm run --workspace streamfusion-worker test

      - name: Build worker dry run
        run: npm run --workspace streamfusion-worker deploy:dry-run

      - name: Android Change Gate
        run: npm run verify:android-gates -- --gate change --run-id "${{ github.run_id }}-change"

  main-api30:
    name: Android Main API 30
    runs-on: ubuntu-latest
    needs: ci-success
    env:
      CURRENT_ANDROID_API: "36"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build Android development APK
        run: npm run build:mobile:development

      - name: Enable KVM access for the ephemeral Android job
        run: |
          # This documented rule only changes /dev/kvm. The hosted runner is discarded after this job.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run API 30 Android smoke journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check
          script: |
            ANDROID_GATE_EVIDENCE_DIR=artifacts/mobile-evidence/android-smoke/api30 \
            ANDROID_GATE_JOURNEY_REPORT=artifacts/mobile-evidence/android-smoke/api30/journey.json \
            bash .github/scripts/android-smoke-journey.sh

      - name: Record API 30 smoke evidence
        env:
          ANDROID_GATE_JOURNEY_REPORT: artifacts/mobile-evidence/android-smoke/api30/journey.json
          ANDROID_GATE_SLOT: api30-emulator-smoke
        run: npm run verify:android-gates -- --gate main --run-id "${{ github.run_id }}-main" --apk-path apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload API 30 evidence fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-main-api30-evidence
          path: artifacts/mobile-evidence
          retention-days: 7

      - name: Upload Main APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamfusion-android-main-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  main-current:
    name: Android Main API ${{ env.CURRENT_ANDROID_API }}
    runs-on: ubuntu-latest
    needs: ci-success
    env:
      CURRENT_ANDROID_API: "36"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build Android development APK
        run: npm run build:mobile:development

      - name: Enable KVM access for the ephemeral Android job
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run current API Android smoke journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.CURRENT_ANDROID_API }}
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check
          script: |
            ANDROID_GATE_EVIDENCE_DIR=artifacts/mobile-evidence/android-smoke/current \
            ANDROID_GATE_JOURNEY_REPORT=artifacts/mobile-evidence/android-smoke/current/journey.json \
            bash .github/scripts/android-smoke-journey.sh

      - name: Record current API smoke evidence
        env:
          ANDROID_GATE_JOURNEY_REPORT: artifacts/mobile-evidence/android-smoke/current/journey.json
          ANDROID_GATE_SLOT: current-api-emulator-smoke
        run: npm run verify:android-gates -- --gate main --run-id "${{ github.run_id }}-main" --apk-path apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload current API evidence fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-main-current-evidence
          path: artifacts/mobile-evidence
          retention-days: 7

  main-gate:
    name: Android Main Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [ci-success, main-api30, main-current]
    env:
      CURRENT_ANDROID_API: "36"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download Main APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: streamfusion-android-main-apk
          path: apps/mobile/android/app/build/outputs/apk/debug

      - name: Download Main evidence fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          pattern: android-main-*-evidence
          merge-multiple: true
          path: artifacts/mobile-evidence/incoming

      - name: Evaluate Main Gate
        run: npm run verify:android-gates -- --gate main --run-id "${{ github.run_id }}-main" --read --incoming artifacts/mobile-evidence/incoming --apk-path apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ci-success:
    name: CI success
    if: always()
    needs:
      - verify-deps
      - verify-core
      - verify-mobile
      - verify-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Require every verify shard
        env:
          DEPS: ${{ needs.verify-deps.result }}
          CORE: ${{ needs.verify-core.result }}
          MOBILE: ${{ needs.verify-mobile.result }}
          DESKTOP: ${{ needs.verify-desktop.result }}
        run: |
          test "$DEPS" = success
          test "$CORE" = success
          test "$MOBILE" = success
          test "$DESKTOP" = success

  android-development:
    name: Android development APK
    runs-on: ubuntu-latest
    needs: ci-success
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build Android development APK
        run: npm run build:mobile:development

      - name: Upload development APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamfusion-android-development
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: ci-success
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Install and verify desktop dependencies
        run: |
          npm ci --ignore-scripts
          npm audit signatures
          npm run rebuild:dependencies

      - name: Rebuild native dependencies for package target
        run: npm --prefix apps/desktop run rebuild-deps:${{ matrix.arch }}

      - name: Build shared core
        run: npm run --workspace @streamfusion/core build

      - name: Test Windows system contracts
        if: matrix.platform == 'win32'
        run: npm --prefix apps/desktop run test:system

      - name: Build desktop
        run: npm --prefix apps/desktop run build

      - name: Package desktop
        run: npm --prefix apps/desktop run package:${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamfusion-${{ matrix.platform }}
          path: apps/desktop/release/**/*
          retention-days: 7
