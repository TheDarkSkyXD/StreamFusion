name: Android public release verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts

      - id: public-release
        name: Evaluate public release gate
        continue-on-error: true
        run: npm run verify:android-gates -- --gate public-release --run-id "${{ github.run_id }}-public-release" --read

      - name: Upload public release gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-public-release-evidence
          path: artifacts/mobile-evidence/android-gates
          if-no-files-found: error
          retention-days: 30

      - name: Enforce public release verdict
        if: ${{ steps.public-release.outcome == 'failure' }}
        run: exit 1
