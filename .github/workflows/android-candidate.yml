name: Android candidate verification

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts

      - id: candidate
        name: Evaluate candidate gate
        continue-on-error: true
        run: npm run verify:android-gates -- --gate candidate --run-id "${{ github.run_id }}-candidate"

      - name: Upload candidate gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-candidate-evidence
          path: artifacts/mobile-evidence/android-gates
          if-no-files-found: error
          retention-days: 30

      - name: Enforce candidate verdict
        if: ${{ steps.candidate.outcome == 'failure' }}
        run: exit 1
